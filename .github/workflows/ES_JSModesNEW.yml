name: erstelle ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    # Native arm64 hardware - free for public repositories, no QEMU needed.
    # This replaces the earlier QEMU-emulated build, which crashed
    # (cc1plus segfault) under heavy parallel -O3 C++ compilation - a
    # known QEMU user-mode emulation weakness, not a code bug.
    # NOTE: ubuntu-24.04-arm / ubuntu-22.04-arm runners only work on
    # PUBLIC repositories on the free/Team plans. If this repo is ever
    # made private, this job will fail to pick up a runner and you'd
    # need to fall back to the QEMU approach or a self-hosted ARM runner.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository (for the patcher/verifier scripts)
        uses: actions/checkout@v4

      - name: Install Build Dependencies (native arm64 packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
            libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
            libeigen3-dev libboost-all-dev rapidjson-dev \
            libvlc-dev libvlccore-dev vlc-bin python3 fonts-droid-fallback binutils

      - name: Clone EmulationStation-fcamod Source (Recursive)
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

      - name: Deep Scan Codebase & Auto-Integrate Custom LED Modes + OTA Menu
        run: python3 .github/scripts/patch_es_source.py

      - name: Build EmulationStation Binary (native aarch64 compiler)
        working-directory: es-source
        env:
          CFLAGS: "-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing"
          CXXFLAGS: "-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing"
        run: |
          set -e
          if [ -f premake5.lua ]; then
            echo "[*] premake5.lua gefunden - baue mit Premake5"
            if ! command -v premake5 >/dev/null 2>&1; then
              echo "[*] Kein premake5-Binary vorhanden - baue Premake5 aus dem Quellcode fuer aarch64"
              git clone --depth 1 https://github.com/premake/premake-core.git /tmp/premake-core
              make -C /tmp/premake-core -f Bootstrap.mak linux
              sudo cp /tmp/premake-core/bin/release/premake5 /usr/local/bin/premake5
            fi
            premake5 gmake2
            make -j"$(nproc)" config=release CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS"
          elif [ -f CMakeLists.txt ]; then
            echo "[*] Kein premake5.lua gefunden - Fallback auf CMake"
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            make -j"$(nproc)"
          else
            echo "[!] Weder premake5.lua noch CMakeLists.txt gefunden - Build-System unbekannt. Abbruch."
            exit 1
          fi

      - name: Verify Custom Strings in Compiled Binary
        run: python3 .github/scripts/verify_es_binary.py

      - name: Upload Built Binary
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: |
            es-source/**/emulationstation*
          retention-days: 14
          if-no-files-found: error
