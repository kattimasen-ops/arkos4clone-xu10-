name: Bastel ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (for the patcher/verifier scripts)
        uses: actions/checkout@v4

      - name: Install Host Tooling (patch step + verify step only)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 binutils git

      - name: Clone EmulationStation-fcamod Source (Recursive)
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

      - name: Deep Scan Codebase & Auto-Integrate Custom LED Modes + OTA Menu
        run: python3 .github/scripts/patch_es_source.py

      - name: Set up QEMU (for aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # IMPORTANT: ubuntu-latest runners are x86_64. The M9 Pro / RK3326 is
      # aarch64 (Cortex-A35), and "-mcpu=cortex-a35 -mtune=cortex-a35" are
      # ARM-only flags that the host's native x86_64 gcc cannot accept -
      # that is exactly what the "bad value 'cortex-a35' for '-mtune='"
      # error means. This step performs the actual compilation inside a
      # QEMU-emulated aarch64 Ubuntu container, where apt installs real
      # arm64 packages and gcc/g++ are genuine aarch64 compilers.
      - name: Cross-Build EmulationStation Binary (aarch64 container)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential cmake pkg-config git curl \
              libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
              libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
              libeigen3-dev libboost-all-dev rapidjson-dev \
              libvlc-dev libvlccore-dev vlc-bin python3 fonts-droid-fallback
          run: |
            set -e
            export CFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing"
            export CXXFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing"
            cd es-source

            if [ -f premake5.lua ]; then
              echo "[*] premake5.lua gefunden - baue mit Premake5 (aarch64)"
              if ! command -v premake5 >/dev/null 2>&1; then
                echo "[*] Kein premake5-Binary vorhanden - baue Premake5 aus dem Quellcode fuer aarch64"
                git clone --depth 1 https://github.com/premake/premake-core.git /tmp/premake-core
                make -C /tmp/premake-core -f Bootstrap.mak linux
                cp /tmp/premake-core/bin/release/premake5 /usr/local/bin/premake5
              fi
              premake5 gmake2
              make -j"$(nproc)" config=release CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS"
            elif [ -f CMakeLists.txt ]; then
              echo "[*] Kein premake5.lua gefunden - Fallback auf CMake"
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release
              make -j"$(nproc)"
            else
              echo "[!] Weder premake5.lua noch CMakeLists.txt gefunden - Build-System unbekannt. Abbruch."
              exit 1
            fi

      - name: Verify Custom Strings in Compiled Binary
        run: python3 .github/scripts/verify_es_binary.py

      - name: Upload Built Binary
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: |
            es-source/**/emulationstation*
          retention-days: 14
          if-no-files-found: error
