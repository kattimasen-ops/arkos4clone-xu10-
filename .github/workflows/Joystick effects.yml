name: Build EmulationStation ARM64 (ArkOS Compatible)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Native ARM64 Binary via QEMU (Ubuntu 20.04)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          run: |
            # 1. Capture host absolute workspace reference
            WORKSPACE_ROOT="${PWD}"

            # 2. Install target build tools and libraries
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake git pkg-config libsdl2-dev libfreeimage-dev \
              libfreetype6-dev libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
              libgles2-mesa-dev libboost-system-dev libboost-filesystem-dev \
              libboost-date-time-dev libboost-locale-dev rapidjson-dev zip ca-certificates

            # 3. Smart Search: Find the exact CMakeLists.txt belonging to EmulationStation
            echo "[+] Locating official EmulationStation CMakeLists.txt..."
            SRC_FILE=""
            for file in $(find "$WORKSPACE_ROOT" -name "CMakeLists.txt"); do
              if grep -qi "emulationstation" "$file"; then
                SRC_FILE="$file"
                break
              fi
            done

            if [ -z "$SRC_FILE" ]; then
              echo "[CRITICAL ERROR] Could not find the EmulationStation source root CMakeLists.txt!"
              exit 1
            fi

            SRC_DIR=$(dirname "$SRC_FILE")
            echo "[+] Found true EmulationStation source at: $SRC_DIR"
            cd "$SRC_DIR"

            # 4. Compile EmulationStation against GLIBC 2.31
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # 5. Assemble flattened release package structure
            PACKAGE_DIR="$WORKSPACE_ROOT/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            # Copy binary and UI resource directory
            cp emulationstation "$PACKAGE_DIR/"
            [ -d "../resources" ] && cp -r "../resources" "$PACKAGE_DIR/"

            # Return to repo root to collect helper scripts safely
            cd "$WORKSPACE_ROOT"
            for script in es_patch.sh mcu_led_daemon.sh update_check.sh; do
              if [ -f "$script" ]; then
                cp "$script" "$PACKAGE_DIR/"
              elif [ -f ".github/scripts/$script" ]; then
                cp ".github/scripts/$script" "$PACKAGE_DIR/"
              fi
            done

            # 6. Generate final flattened ZIP artifact
            cd "$PACKAGE_DIR"
            zip -r "$WORKSPACE_ROOT/build_output/emulationstation-fcamod-m9pro.zip" .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
          retention-days: 7
