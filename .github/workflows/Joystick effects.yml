name: fnkt ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build EmulationStation for ARM64 (RK3326 / Cortex-A35)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          install: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              build-essential cmake pkg-config git \
              libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
              libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
              libeigen3-dev libboost-all-dev rapidjson-dev \
              libvlc-dev libvlccore-dev vlc-bin python3 fonts-droid-fallback binutils \
              ca-certificates
          run: |
            # Clone source repository
            git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

            # Run Python patcher using absolute repository workspace path
            if [ -f "$GITHUB_WORKSPACE/.github/scripts/patch_es_source.py" ]; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/patch_es_source.py"
            fi

            # Build ES with Cortex-A35 optimization flags and memory safety (-j2)
            cd es-source
            export CFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe -fno-strict-aliasing -Wno-unused-result -Wno-error"
            export CXXFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe -std=c++17 -fno-strict-aliasing -static-libgcc -static-libstdc++ -Wno-unused-result -Wno-error"
            export LDFLAGS="-static-libgcc -static-libstdc++"

            if [ -f premake5.lua ]; then
              echo "[*] premake5.lua found - building with Premake5"
              if ! command -v premake5 >/dev/null 2>&1; then
                git clone --depth 1 https://github.com/premake/premake-core.git /tmp/premake-core
                make -C /tmp/premake-core -f Bootstrap.mak linux
                cp /tmp/premake-core/bin/release/premake5 /usr/local/bin/premake5
              fi
              premake5 gmake2
              make -j2 config=release CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS"
            elif [ -f CMakeLists.txt ]; then
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17
              make -j2
            else
              echo "[!] No supported build system found."
              exit 1
            fi

            # Execute verification script using absolute repository workspace path
            if [ -f "$GITHUB_WORKSPACE/.github/scripts/verify_es_binary.py" ]; then
              python3 "$GITHUB_WORKSPACE/.github/scripts/verify_es_binary.py"
            fi

      - name: Upload Built Binary & Companion Scripts
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: |
            es-source/**/emulationstation
            es-source/resources/
            mcu_led_daemon.sh
            update_check.sh
            es_patch.sh
          retention-days: 14
          if-no-files-found: warn
