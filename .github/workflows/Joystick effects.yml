name: Bastel ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
            libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
            libeigen3-dev libboost-all-dev rapidjson-dev \
            libvlc-dev libvlccore-dev vlc-bin python3 fonts-droid-fallback binutils

      - name: Clone EmulationStation-fcamod Source (Recursive)
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

      - name: Patch Source (OTA + RGB LED)
        run: |
          python3 .github/scripts/patch_es_source.py

      - name: Build EmulationStation
        run: |
          cd es-source
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Verify Binary
        run: |
          python3 .github/scripts/verify_es_binary.py
