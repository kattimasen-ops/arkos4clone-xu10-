name: Build EmulationStation ARM64 (ArkOS Compatible)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Native ARM64 Binary via QEMU (Ubuntu 20.04 / GLIBC 2.31)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          run: |
            WORKSPACE_ROOT="${PWD}"

            # Install complete and exact build dependencies for EmulationStation-fcamod
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake git pkg-config libsdl2-dev libsdl2-mixer-dev \
              libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev libasound2-dev \
              libgl1-mesa-dev libgles2-mesa-dev libboost-system-dev libboost-filesystem-dev \
              libboost-date-time-dev libboost-locale-dev rapidjson-dev zip ca-certificates \
              libvlc-dev libvlccore-dev vlc-bin

            # Clone official source code compatible with ArkOS ports
            echo "[+] Cloning official EmulationStation-fcamod source..."
            git clone --recursive --depth=1 https://github.com/christianhaitian/EmulationStation-fcamod.git /tmp/es-source
            
            cd /tmp/es-source

            # Compile release build targeting exact host constraints
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # Package binary and UI resources into a flattened layout
            PACKAGE_DIR="$WORKSPACE_ROOT/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            cp emulationstation "$PACKAGE_DIR/"
            [ -d "../resources" ] && cp -r "../resources" "$PACKAGE_DIR/"

            # Collect helper scripts from repository root
            cd "$WORKSPACE_ROOT"
            for script in es_patch.sh mcu_led_daemon.sh update_check.sh; do
              if [ -f "$script" ]; then
                cp "$script" "$PACKAGE_DIR/"
              elif [ -f ".github/scripts/$script" ]; then
                cp ".github/scripts/$script" "$PACKAGE_DIR/"
              fi
            done

            # Create artifact zip
            cd "$PACKAGE_DIR"
            zip -r "$WORKSPACE_ROOT/build_output/emulationstation-fcamod-m9pro.zip" .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
          retention-days: 7
