name: Build EmulationStation for M9 Pro (ArkOS / ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU & Run on ARM64 Container (Ubuntu 20.04)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: none
          distro: none
          base_image: '--platform=linux/aarch64 ubuntu:20.04'
          githubToken: ${{ github.token }}
          run: |
            set -e
            WORKSPACE_ROOT="${PWD}"

            echo "[+] Step 1: Installing build prerequisites and premake4..."
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake git pkg-config libsdl2-dev libsdl2-mixer-dev \
              libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev libasound2-dev \
              libgl1-mesa-dev libgles2-mesa-dev libboost-system-dev libboost-filesystem-dev \
              libboost-date-time-dev libboost-locale-dev rapidjson-dev zip ca-certificates \
              libvlc-dev libvlccore-dev vlc-bin premake4 libevdev-dev

            echo "[+] Step 2: Automatically cloning and building libgo2..."
            git clone --depth=1 https://github.com/OtherCrashOverride/libgo2.git /tmp/libgo2
            cd /tmp/libgo2
            premake4 gmake
            make -j$(nproc)

            # Install headers and shared libraries to system paths
            mkdir -p /usr/include/go2
            cp src/*.h /usr/include/go2/
            cp libgo2.so* /usr/lib/aarch64-linux-gnu/ 2>/dev/null || cp libgo2.so* /usr/lib/

            echo "[+] Step 3: Cloning official EmulationStation-fcamod source..."
            git clone --recursive --depth=1 https://github.com/christianhaitian/EmulationStation-fcamod.git /tmp/es-source
            cd /tmp/es-source

            echo "[+] Step 4: Configuring and compiling EmulationStation..."
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            echo "[+] Step 5: Packaging build assets..."
            PACKAGE_DIR="$WORKSPACE_ROOT/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            # Copy binary and resources
            cp emulationstation "$PACKAGE_DIR/"
            [ -d "../resources" ] && cp -r "../resources" "$PACKAGE_DIR/"

            # Copy any custom scripts from your root repo or .github/scripts if they exist
            cd "$WORKSPACE_ROOT"
            for script in es_patch.sh mcu_led_daemon.sh update_check.sh; do
              if [ -f "$script" ]; then
                cp "$script" "$PACKAGE_DIR/"
              elif [ -f ".github/scripts/$script" ]; then
                cp ".github/scripts/$script" "$PACKAGE_DIR/"
              fi
            done

            echo "[+] Step 6: Creating final release archive..."
            cd "$PACKAGE_DIR"
            zip -r "$WORKSPACE_ROOT/build_output/emulationstation-fcamod-m9pro.zip" .
            echo "[✓] Build complete successfully!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
