name: fnkt ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up ARM64 Cross-Compilation Architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
          sudo sed -i 's/deb \[arch=amd64,i386\] http:\/\/security/deb [arch=amd64,i386] http:\/\/security/g' /etc/apt/sources.list
          
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential cmake pkg-config git python3 binutils \
            libsdl2-dev:arm64 libsdl2-mixer-dev:arm64 libfreeimage-dev:arm64 libfreetype6-dev:arm64 \
            libcurl4-openssl-dev:arm64 libasound2-dev:arm64 libgl1-mesa-dev:arm64 \
            libeigen3-dev rapidjson-dev \
            libboost-system-dev:arm64 libboost-filesystem-dev:arm64 libboost-date-time-dev:arm64 \
            libboost-locale-dev:arm64 libboost-serialization-dev:arm64 \
            libvlc-dev:arm64 libvlccore-dev:arm64

      - name: Clone & Patch Source Code
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

          if [ -f "$GITHUB_WORKSPACE/.github/scripts/patch_es_source.py" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/patch_es_source.py"
          fi

      - name: Cross-Compile EmulationStation (Native Host -> ARM64)
        run: |
          cd es-source
          
          export CFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe -fno-strict-aliasing"
          export CXXFLAGS="-mcpu=cortex-a35 -mtune=cortex-a35 -O2 -pipe -std=c++17 -fno-strict-aliasing"

          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17
          
          make -j$(nproc)

          cd "$GITHUB_WORKSPACE"
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/verify_es_binary.py" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/verify_es_binary.py"
          fi

      - name: Upload Built Binary & Companion Scripts
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: |
            es-source/**/emulationstation
            es-source/resources/
            mcu_led_daemon.sh
            update_check.sh
            es_patch.sh
          retention-days: 14
          if-no-files-found: warn
