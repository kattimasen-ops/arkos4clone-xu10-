name: Build EmulationStation ARM64 (ArkOS Compatible)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Native ARM64 Binary via QEMU (Ubuntu 20.04)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/build_output"
          run: |
            # 1. Update system and install dependencies in Ubuntu 20.04 container
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              cmake \
              git \
              pkg-config \
              libsdl2-dev \
              libfreeimage-dev \
              libfreetype6-dev \
              libcurl4-openssl-dev \
              libasound2-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              libboost-system-dev \
              libboost-filesystem-dev \
              libboost-date-time-dev \
              libboost-locale-dev \
              rapidjson-dev \
              zip \
              ca-certificates

            # 2. Compile directly in-tree to prevent container mount path resolution failures
            cmake -DCMAKE_BUILD_TYPE=Release .
            make -j$(nproc)

            # 3. Assemble flattened package directory
            PACKAGE_DIR="${PWD}/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            # Copy compiled binary
            cp emulationstation "$PACKAGE_DIR/"

            # Copy UI resources folder
            if [ -d "resources" ]; then
              cp -r resources "$PACKAGE_DIR/"
            fi

            # Locate and copy scripts (check repository root first, then .github/scripts/)
            for script in es_patch.sh mcu_led_daemon.sh update_check.sh; do
              if [ -f "$script" ]; then
                cp "$script" "$PACKAGE_DIR/"
              elif [ -f ".github/scripts/$script" ]; then
                cp ".github/scripts/$script" "$PACKAGE_DIR/"
              fi
            done

            # 4. Create flattened ZIP archive
            cd "$PACKAGE_DIR"
            zip -r "${PWD}/../emulationstation-fcamod-m9pro.zip" .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
          retention-days: 7
