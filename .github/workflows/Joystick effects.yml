name: Build EmulationStation ARM64 (ArkOS Compatible)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Native ARM64 Binary via QEMU (Ubuntu 20.04)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/build_output"
          run: |
            # 1. Force context into the container's mounted workspace root
            cd /github/workspace

            # 2. Update system and install build dependencies
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential \
              cmake \
              git \
              pkg-config \
              libsdl2-dev \
              libfreeimage-dev \
              libfreetype6-dev \
              libcurl4-openssl-dev \
              libasound2-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              libboost-system-dev \
              libboost-filesystem-dev \
              libboost-date-time-dev \
              libboost-locale-dev \
              rapidjson-dev \
              zip \
              ca-certificates

            # 3. Compile EmulationStation against GLIBC 2.31
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release /github/workspace
            make -j$(nproc)
            cd /github/workspace

            # 4. Assemble flattened release package
            PACKAGE_DIR="/github/workspace/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            # Copy compiled executable
            cp build/emulationstation "$PACKAGE_DIR/"

            # Copy UI resources directory if present
            if [ -d "resources" ]; then
              cp -r resources "$PACKAGE_DIR/"
            fi

            # Copy installation and daemon scripts if present
            [ -f "es_patch.sh" ] && cp es_patch.sh "$PACKAGE_DIR/"
            [ -f "mcu_led_daemon.sh" ] && cp mcu_led_daemon.sh "$PACKAGE_DIR/"
            [ -f "update_check.sh" ] && cp update_check.sh "$PACKAGE_DIR/"

            # 5. Create ZIP artifact containing all flat files
            cd "$PACKAGE_DIR"
            zip -r "/github/workspace/build_output/emulationstation-fcamod-m9pro.zip" .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
          retention-days: 7
