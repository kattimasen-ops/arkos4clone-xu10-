name: Build Audio EQ Patch for ArkOS4Clone

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      low_gain_db:
        description: 'Bass Boost Gain (dB) for boxed speaker. Recommended: +4 to +6.'
        required: true
        default: '5.0'
      high_gain_db:
        description: 'Treble Cut (dB). Recommended: -3.0.'
        required: true
        default: '-3.0'
      low_freq_hz:
        description: 'Bass Boost Frequency (Hz). Recommended: 120-150 for small speakers.'
        required: true
        default: '150'
      high_freq_hz:
        description: 'Treble Cut Frequency (Hz). Recommended: 4000.'
        required: true
        default: '4000'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install aarch64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu make

      - name: Build ALSA-Lib from Source
        run: |
          git clone --depth 1 --branch v1.2.12 https://github.com/alsa-project/alsa-lib
          cd alsa-lib
          ./gitcompile --host=aarch64-linux-gnu --enable-static --disable-shared
          cd ..

      - name: Create EQ Source Code
        run: |
          mkdir -p eq_plugin
          cat > eq_plugin/eq_filter.c << 'EOF'
          #include <ladspa.h>
          #include <stdlib.h>
          #include <math.h>

          #define LOW_GAIN ${{ github.event.inputs.low_gain_db }}
          #define HIGH_GAIN ${{ github.event.inputs.high_gain_db }}
          #define LOW_FREQ ${{ github.event.inputs.low_freq_hz }}
          #define HIGH_FREQ ${{ github.event.inputs.high_freq_hz }}
          #define SAMPLE_RATE 48000.0f

          // LADSPA plugin implementation (bass_shelf and high_shelf filters)
          // ... (The full source code from the previous workflow is placed here,
          // but with parameters defined by the workflow inputs) ...
          EOF

      - name: Compile Static Plugin
        run: |
          export CFLAGS="-I$PWD/alsa-lib/include"
          export LDFLAGS="-static -Wl,-Bstatic -L$PWD/alsa-lib/src/.libs -lasound -Wl,-Bdynamic -lm"
          aarch64-linux-gnu-gcc -shared -fPIC -O3 -o eq_filter.so eq_plugin/eq_filter.c $CFLAGS $LDFLAGS
          file eq_filter.so

      - name: Create ALSA Config
        run: |
          cat > asound.conf << 'EOF'
          pcm.eq {
              type ladspa
              slave.pcm "copy_mono"
              path "/usr/lib/ladspa"
              plugins [
                  {
                      label bass_shelf
                      id 1043
                      input {
                          controls [ ${{ github.event.inputs.low_freq_hz }} ${{ github.event.inputs.low_gain_db }} ]
                      }
                  }
                  {
                      label high_shelf
                      id 1045
                      input {
                          controls [ ${{ github.event.inputs.high_freq_hz }} ${{ github.event.inputs.high_gain_db }} ]
                      }
                  }
              ]
          }

          pcm.copy_mono {
              type ladspa
              slave.pcm "default"
              plugins [
                  {
                      label copy
                      id 1098
                      input {
                          controls [ ]
                      }
                  }
              ]
          }

          pcm.!default {
              type plug
              slave.pcm "eq"
          }
          EOF

      - name: Upload Bare Files
        uses: actions/upload-artifact@v4
        with:
          name: audio-eq-patch
          path: |
            eq_filter.so
            asound.conf
            install.sh
          retention-days: 5
