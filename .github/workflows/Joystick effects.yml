name: Build Audio EQ Patch for ArkOS4Clone

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      low_gain_db:
        description: 'Bass Boost Gain (dB) for boxed speaker. Recommended: +4 to +6.'
        required: true
        default: '5.0'
      high_gain_db:
        description: 'Treble Cut (dB). Recommended: -3.0.'
        required: true
        default: '-3.0'
      low_freq_hz:
        description: 'Bass Boost Frequency (Hz). Recommended: 120-150 for small speakers.'
        required: true
        default: '150'
      high_freq_hz:
        description: 'Treble Cut Frequency (Hz). Recommended: 4000.'
        required: true
        default: '4000'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. Checkout the forked repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install the aarch64 cross-compilation toolchain
      - name: Install aarch64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu make

      # 3. Build ALSA-Lib from Source (for static linking)
      - name: Build ALSA-Lib for Target
        run: |
          git clone --depth 1 --branch v1.2.12 https://github.com/alsa-project/alsa-lib
          cd alsa-lib
          ./gitcompile --host=aarch64-linux-gnu --enable-static --disable-shared
          cd ..
          # VERIFY: Ensure libasound.a was created
          test -f alsa-lib/src/.libs/libasound.a && echo "ALSA static library built OK"

      # 4. Fetch and Build LADSPA SDK - Building ONLY the 'plugins' target
      # This avoids the 'analyseplugin' dependency on libsndfile.
      - name: Build LADSPA SDK Plugins
        run: |
          wget https://www.ladspa.org/download/ladspa_sdk_1.17.tgz
          echo "27d24f279e4b81bd17ecbdcc38e4c42991bb388826c0b200067ce0eb59d3da5b  ladspa_sdk_1.17.tgz" | sha256sum -c -
          tar -xzf ladspa_sdk_1.17.tgz
          # Build only the plugins. This will produce the 'ladspa.h' header.
          make -C ladspa_sdk_1.17/src CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ plugins
          # VERIFY: Ensure ladspa.h exists
          test -f ladspa_sdk_1.17/src/ladspa.h && echo "LADSPA SDK 'plugins' target built OK"

      # 5. Create EQ Source Code
      - name: Create EQ Source Code
        run: |
          mkdir -p eq_plugin
          cat > eq_plugin/eq_filter.c << 'EOF'
          #include <ladspa.h>
          #include <stdlib.h>
          #include <math.h>

          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif

          #define LOW_GAIN ${{ github.event.inputs.low_gain_db }}
          #define HIGH_GAIN ${{ github.event.inputs.high_gain_db }}
          #define LOW_FREQ ${{ github.event.inputs.low_freq_hz }}
          #define HIGH_FREQ ${{ github.event.inputs.high_freq_hz }}
          #define SAMPLE_RATE 48000.0f

          // --- Low Shelf Filter Plugin (ID 1043, label "bass_shelf") ---
          typedef struct {
              float *input;
              float *output;
              float *freq;
              float *gain;
              float x1, x2, y1, y2;
              float x1r, x2r, y1r, y2r;
          } LowShelf;

          static LADSPA_Handle low_shelf_instantiate(unsigned long rate) {
              LowShelf *p = (LowShelf*)calloc(1, sizeof(LowShelf));
              p->x1 = p->x2 = p->y1 = p->y2 = 0.0f;
              p->x1r = p->x2r = p->y1r = p->y2r = 0.0f;
              return (LADSPA_Handle)p;
          }

          static void low_shelf_connect(LADSPA_Handle handle, unsigned long port, LADSPA_Data *data) {
              LowShelf *p = (LowShelf*)handle;
              switch (port) {
                  case 0: p->input = data; break;
                  case 1: p->output = data; break;
                  case 2: p->freq = data; break;
                  case 3: p->gain = data; break;
              }
          }

          static void low_shelf_run(LADSPA_Handle handle, unsigned long n) {
              LowShelf *p = (LowShelf*)handle;
              if (!p || !p->input || !p->output) return;

              float A = pow(10.0f, (*p->gain) / 40.0f);
              float w0 = 2.0f * M_PI * (*p->freq) / SAMPLE_RATE;
              float alpha = sin(w0) / 2.0f * sqrt((A + 1.0f/A) * (1.0f/0.707f - 1.0f) + 2.0f);
              float b0 = A * ((A + 1.0f) - (A - 1.0f) * cos(w0) + 2.0f * sqrt(A) * alpha);
              float b1 = 2.0f * A * ((A - 1.0f) - (A + 1.0f) * cos(w0));
              float b2 = A * ((A + 1.0f) - (A - 1.0f) * cos(w0) - 2.0f * sqrt(A) * alpha);
              float a0 = ((A + 1.0f) + (A - 1.0f) * cos(w0) + 2.0f * sqrt(A) * alpha);
              float a1 = -2.0f * ((A - 1.0f) + (A + 1.0f) * cos(w0));
              float a2 = ((A + 1.0f) + (A - 1.0f) * cos(w0) - 2.0f * sqrt(A) * alpha);
              float b0n = b0/a0, b1n = b1/a0, b2n = b2/a0, a1n = a1/a0, a2n = a2/a0;

              for (unsigned long i = 0; i < n; i++) {
                  float in_l = p->input[i*2];
                  float out_l = b0n * in_l + b1n * p->x1 + b2n * p->x2 - a1n * p->y1 - a2n * p->y2;
                  p->x2 = p->x1; p->x1 = in_l;
                  p->y2 = p->y1; p->y1 = out_l;
                  p->output[i*2] = out_l;

                  float in_r = p->input[i*2 + 1];
                  float out_r = b0n * in_r + b1n * p->x1r + b2n * p->x2r - a1n * p->y1r - a2n * p->y2r;
                  p->x2r = p->x1r; p->x1r = in_r;
                  p->y2r = p->y1r; p->y1r = out_r;
                  p->output[i*2 + 1] = out_r;
              }
          }

          static void low_shelf_cleanup(LADSPA_Handle handle) {
              free(handle);
          }

          // --- High Shelf Filter Plugin (ID 1045, label "high_shelf") ---
          typedef struct {
              float *input;
              float *output;
              float *freq;
              float *gain;
              float x1, x2, y1, y2;
              float x1r, x2r, y1r, y2r;
          } HighShelf;

          static LADSPA_Handle high_shelf_instantiate(unsigned long rate) {
              HighShelf *p = (HighShelf*)calloc(1, sizeof(HighShelf));
              p->x1 = p->x2 = p->y1 = p->y2 = 0.0f;
              p->x1r = p->x2r = p->y1r = p->y2r = 0.0f;
              return (LADSPA_Handle)p;
          }

          static void high_shelf_connect(LADSPA_Handle handle, unsigned long port, LADSPA_Data *data) {
              HighShelf *p = (HighShelf*)handle;
              switch (port) {
                  case 0: p->input = data; break;
                  case 1: p->output = data; break;
                  case 2: p->freq = data; break;
                  case 3: p->gain = data; break;
              }
          }

          static void high_shelf_run(LADSPA_Handle handle, unsigned long n) {
              HighShelf *p = (HighShelf*)handle;
              if (!p || !p->input || !p->output) return;

              float A = pow(10.0f, (*p->gain) / 40.0f);
              float w0 = 2.0f * M_PI * (*p->freq) / SAMPLE_RATE;
              float alpha = sin(w0) / 2.0f * sqrt((A + 1.0f/A) * (1.0f/0.707f - 1.0f) + 2.0f);
              float b0 = A * ((A + 1.0f) + (A - 1.0f) * cos(w0) + 2.0f * sqrt(A) * alpha);
              float b1 = -2.0f * A * ((A - 1.0f) + (A + 1.0f) * cos(w0));
              float b2 = A * ((A + 1.0f) + (A - 1.0f) * cos(w0) - 2.0f * sqrt(A) * alpha);
              float a0 = ((A + 1.0f) - (A - 1.0f) * cos(w0) + 2.0f * sqrt(A) * alpha);
              float a1 = 2.0f * ((A - 1.0f) - (A + 1.0f) * cos(w0));
              float a2 = ((A + 1.0f) - (A - 1.0f) * cos(w0) - 2.0f * sqrt(A) * alpha);
              float b0n = b0/a0, b1n = b1/a0, b2n = b2/a0, a1n = a1/a0, a2n = a2/a0;

              for (unsigned long i = 0; i < n; i++) {
                  float in_l = p->input[i*2];
                  float out_l = b0n * in_l + b1n * p->x1 + b2n * p->x2 - a1n * p->y1 - a2n * p->y2;
                  p->x2 = p->x1; p->x1 = in_l;
                  p->y2 = p->y1; p->y1 = out_l;
                  p->output[i*2] = out_l;

                  float in_r = p->input[i*2 + 1];
                  float out_r = b0n * in_r + b1n * p->x1r + b2n * p->x2r - a1n * p->y1r - a2n * p->y2r;
                  p->x2r = p->x1r; p->x1r = in_r;
                  p->y2r = p->y1r; p->y1r = out_r;
                  p->output[i*2 + 1] = out_r;
              }
          }

          static void high_shelf_cleanup(LADSPA_Handle handle) {
              free(handle);
          }

          // Plugin Descriptors
          static LADSPA_Descriptor low_desc = {
              1043,
              "bass_shelf",
              LADSPA_PROPERTY_HARD_RT_CAPABLE,
              "Bass Shelf Boost",
              "ArkOS4clone",
              "GPL",
              4,
              { LADSPA_PORT_INPUT | LADSPA_PORT_AUDIO,
                LADSPA_PORT_OUTPUT | LADSPA_PORT_AUDIO,
                LADSPA_PORT_CONTROL,
                LADSPA_PORT_CONTROL },
              { "Input", "Output", "Frequency (Hz)", "Gain (dB)" },
              low_shelf_instantiate,
              low_shelf_connect,
              low_shelf_run,
              NULL,
              NULL,
              low_shelf_cleanup
          };

          static LADSPA_Descriptor high_desc = {
              1045,
              "high_shelf",
              LADSPA_PROPERTY_HARD_RT_CAPABLE,
              "High Shelf Cut",
              "ArkOS4clone",
              "GPL",
              4,
              { LADSPA_PORT_INPUT | LADSPA_PORT_AUDIO,
                LADSPA_PORT_OUTPUT | LADSPA_PORT_AUDIO,
                LADSPA_PORT_CONTROL,
                LADSPA_PORT_CONTROL },
              { "Input", "Output", "Frequency (Hz)", "Gain (dB)" },
              high_shelf_instantiate,
              high_shelf_connect,
              high_shelf_run,
              NULL,
              NULL,
              high_shelf_cleanup
          };

          const LADSPA_Descriptor *ladspa_descriptor(unsigned long index) {
              switch (index) {
                  case 0: return &low_desc;
                  case 1: return &high_desc;
                  default: return NULL;
              }
          }
          EOF

      # 6. Compile Static Plugin
      - name: Compile Static Plugin
        run: |
          export CFLAGS="-I$PWD/alsa-lib/include -I$PWD/ladspa_sdk_1.17/src"
          export LDFLAGS="-static -Wl,-Bstatic -L$PWD/alsa-lib/src/.libs -lasound -Wl,-Bdynamic -lm"
          aarch64-linux-gnu-gcc -shared -fPIC -O3 -o eq_filter.so eq_plugin/eq_filter.c $CFLAGS $LDFLAGS
          file eq_filter.so
          # VERIFY: Check architecture and exported symbol
          if ! aarch64-linux-gnu-readelf -h eq_filter.so | grep -q "AArch64"; then
              echo "Error: Compiled binary is not for aarch64 architecture."
              exit 1
          fi
          aarch64-linux-gnu-nm -D eq_filter.so | grep "ladspa_descriptor" || (echo "Error: ladspa_descriptor symbol missing"; exit 1)
          echo "Plugin compiled successfully."

      # 7. Create ALSA Config - preserves your existing dmix routing
      - name: Create ALSA Config
        run: |
          cat > asound.conf << 'EOF'
          pcm.!default {
              type plug
              slave.pcm "eq"
          }

          pcm.eq {
              type ladspa
              slave.pcm "dmixer"
              path "/usr/lib/ladspa"
              plugins [
                  {
                      label bass_shelf
                      id 1043
                      input {
                          controls [ ${{ github.event.inputs.low_freq_hz }} ${{ github.event.inputs.low_gain_db }} ]
                      }
                  }
                  {
                      label high_shelf
                      id 1045
                      input {
                          controls [ ${{ github.event.inputs.high_freq_hz }} ${{ github.event.inputs.high_gain_db }} ]
                      }
                  }
              ]
          }

          pcm.dmixer  {
              type dmix
              ipc_key 1024
              slave {
                  pcm "hw:0,0"
                  period_time 0
                  period_size 1024
                  buffer_size 4096
                  rate 44100
              }
              bindings {
                  0 0
                  1 1
              }
          }

          ctl.!default { type hw card 0 }
          EOF

      # 8. Create Install Script
      - name: Create Install Script
        run: |
          cat > install.sh << 'EOF'
          #!/bin/sh
          SCRIPT_DIR=$(dirname "$0")
          PLUGIN_SRC="$SCRIPT_DIR/eq_filter.so"
          CONFIG_SRC="$SCRIPT_DIR/asound.conf"
          PLUGIN_DEST="/usr/lib/ladspa/eq_filter.so"
          CONFIG_DEST="/etc/asound.conf"
          BACKUP_DIR="/roms/backup/audio-eq"

          # Safety checks
          if [ ! -f "$PLUGIN_SRC" ] || [ ! -f "$CONFIG_SRC" ]; then
              echo "Error: Patch files not found. Aborting."
              exit 1
          fi

          # Backup
          echo "Creating backup..."
          mkdir -p "$BACKUP_DIR"
          [ -f "$PLUGIN_DEST" ] && cp "$PLUGIN_DEST" "$BACKUP_DIR/eq_filter.so.bak" && echo "Plugin backed up."
          [ -f "$CONFIG_DEST" ] && cp "$CONFIG_DEST" "$BACKUP_DIR/asound.conf.bak" && echo "Config backed up."

          # Stop audio processes
          echo "Stopping audio processes..."
          pkill -f "emulationstation" || true
          pkill -f "retroarch" || true
          pkill -f "pulseaudio" || true
          sleep 2

          # Apply patch (atomic rename + copy)
          echo "Applying patch..."
          [ -f "$PLUGIN_DEST" ] && mv "$PLUGIN_DEST" "$BACKUP_DIR/eq_filter.so.old"
          [ -f "$CONFIG_DEST" ] && mv "$CONFIG_DEST" "$BACKUP_DIR/asound.conf.old"
          cp "$PLUGIN_SRC" "$PLUGIN_DEST"
          cp "$CONFIG_SRC" "$CONFIG_DEST"

          # Verify and rollback on failure
          if [ ! -f "$PLUGIN_DEST" ] || [ ! -f "$CONFIG_DEST" ]; then
              echo "Error: Installation failed. Rolling back..."
              [ -f "$BACKUP_DIR/eq_filter.so.old" ] && mv "$BACKUP_DIR/eq_filter.so.old" "$PLUGIN_DEST"
              [ -f "$BACKUP_DIR/asound.conf.old" ] && mv "$BACKUP_DIR/asound.conf.old" "$CONFIG_DEST"
              exit 1
          fi
          echo "Patch installed successfully."

          # Restart EmulationStation
          echo "Restarting EmulationStation..."
          /usr/bin/emulationstation/emulationstation.sh &
          echo "Done."
          EOF
          chmod +x install.sh

      # 9. Upload Bare Files
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-eq-patch
          path: |
            eq_filter.so
            asound.conf
            install.sh
          retention-days: 5
