name: Build ES with MCU LEDs & Native OTA Update Menu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
            libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
            libeigen3-dev libboost-all-dev rapidjson-dev \
            libvlc-dev libvlccore-dev vlc-bin python3

      - name: Clone EmulationStation-fcamod Source (Recursive)
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

      - name: Smart Patch Settings, Menu, and Thread Guard
        run: |
          python3 - << 'EOF'
          import glob, sys, re

          print("=== STEP 1: Patching Settings & OTA Menu Hook Safely ===")
          cpp_files = glob.glob("es-source/**/*.cpp", recursive=True)
          settings_file = None

          for filepath in cpp_files:
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  if "GuiArkOS4CloneSettings" in filepath or "JoystickLED" in content:
                      settings_file = filepath
                      break
              except Exception:
                  pass

          if not settings_file and cpp_files:
              settings_file = cpp_files[0]

          if settings_file:
              with open(settings_file, "r", encoding="utf-8", errors="ignore") as f:
                  s_content = f.read()
              
              ota_hook = """
              #include <cstdlib>
              // Injected OTA Update Trigger Helper
              static void runOtaUpdateScript() {
                  (void)system("/usr/local/bin/update_check.sh &");
              }
              """
              
              # Insert cleanly after the existing #include block to prevent scope issues
              include_matches = list(re.finditer(r'#include\s+<[^>]+>', s_content))
              if include_matches:
                  last_include_end = include_matches[-1].end()
                  s_content = s_content[:last_include_end] + "\n" + ota_hook + s_content[last_include_end:]
              else:
                  s_content = ota_hook + "\n" + s_content
              
              with open(settings_file, "w", encoding="utf-8") as f:
                  f.write(s_content)
              print(f"[+] Patched settings file successfully: {settings_file}")

          print("=== STEP 2: Injecting Smart MCU Thread Guard & New Effects ===")
          main_files = glob.glob("es-source/**/main.cpp", recursive=True)
          if main_files:
              with open(main_files[0], "r", encoding="utf-8", errors="ignore") as f:
                  main_content = f.read()

              thread_code = """
              #include <thread>
              #include <chrono>
              #include <fstream>
              #include <cstdlib>
              #include <cmath>
              #include <string>
              #include "Settings.h"

              void CustomMCUThread() {
                  std::this_thread::sleep_for(std::chrono::seconds(5));
                  int hue = 0;
                  
                  while(true) {
                      if (Settings::getInstance() != nullptr) {
                          std::string mode = Settings::getInstance()->getString("JoystickLEDMode");
                          
                          if (mode == "battery_status") {
                              std::ifstream bat("/sys/class/power_supply/battery/capacity");
                              int cap = 100;
                              if (bat.is_open()) { bat >> cap; bat.close(); }
                              
                              if (cap >= 60) (void)system("/usr/bin/mcu_led 0 255 0 &");
                              else if (cap >= 25) (void)system("/usr/bin/mcu_led 255 150 0 &");
                              else (void)system("/usr/bin/mcu_led 255 0 0 &");
                              
                              std::this_thread::sleep_for(std::chrono::seconds(5));
                          }
                          else if (mode == "rainbow_wave") {
                              hue = (hue + 15) % 360;
                              double rad = hue * 3.14159 / 180.0;
                              int r = (int)((std::sin(rad) + 1.0) * 127.5);
                              int g = (int)((std::sin(rad + 2.094) + 1.0) * 127.5);
                              int b = (int)((std::sin(rad + 4.188) + 1.0) * 127.5);
                              std::string cmd = "/usr/bin/mcu_led " + std::to_string(r) + " " + std::to_string(g) + " " + std::to_string(b) + " &";
                              (void)system(cmd.c_str());
                              std::this_thread::sleep_for(std::chrono::milliseconds(100));
                          }
                          else if (mode == "strobe_party") {
                              (void)system("/usr/bin/mcu_led 255 0 0 &");
                              std::this_thread::sleep_for(std::chrono::milliseconds(120));
                              (void)system("/usr/bin/mcu_led 0 255 0 &");
                              std::this_thread::sleep_for(std::chrono::milliseconds(120));
                              (void)system("/usr/bin/mcu_led 0 0 255 &");
                              std::this_thread::sleep_for(std::chrono::milliseconds(120));
                          }
                          else if (mode == "color_fade") {
                              hue = (hue + 5) % 360;
                              double rad = hue * 3.14159 / 180.0;
                              int r = (int)((std::sin(rad) + 1.0) * 127.5);
                              int g = (int)((std::sin(rad + 2.094) + 1.0) * 127.5);
                              int b = (int)((std::sin(rad + 4.188) + 1.0) * 127.5);
                              std::string cmd = "/usr/bin/mcu_led " + std::to_string(r) + " " + std::to_string(g) + " " + std::to_string(b) + " &";
                              (void)system(cmd.c_str());
                              std::this_thread::sleep_for(std::chrono::milliseconds(250));
                          }
                          else {
                              std::this_thread::sleep_for(std::chrono::seconds(2));
                          }
                      } else {
                          std::this_thread::sleep_for(std::chrono::seconds(2));
                      }
                  }
              }
              """

              main_content = thread_code + "\n" + main_content
              main_content = re.sub(r'(int\s+main\s*\([^\)]*\)\s*\{)', r'\1\n    std::thread mcuThread(CustomMCUThread);\n    mcuThread.detach();\n', main_content, count=1)

              with open(main_files[0], "w", encoding="utf-8") as f:
                  f.write(main_content)
              print("[+] Successfully injected smart background thread into main.cpp")
          EOF

      - name: Build EmulationStation Binary
        run: |
          cd es-source
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-error=unused-result"
          make -j$(nproc)

      - name: Verify Binary and Generate Detailed Log
        run: |
          python3 - << 'EOF'
          import os, glob, sys

          es_binaries = glob.glob("es-source/emulationstation") or glob.glob("es-source/**/emulationstation", recursive=True)
          if not es_binaries:
              print("[!] ERROR: Compiled binary not found!")
              sys.exit(1)

          binary_path = es_binaries[0]
          print(f"[+] Found compiled binary at {binary_path}")

          with open(binary_path, "rb") as f:
              bin_data = f.read()

          expected_modes = ["rainbow_wave", "strobe_party", "color_fade", "battery_status"]
          found_modes = [mode for mode in expected_modes if mode.encode("utf-8") in bin_data]

          log_content = "=== ARKOS4CLONE EMULATIONSTATION RGB MODE REPORT ===\n\n"
          log_content += f"Binary Verified: {binary_path}\n"
          log_content += f"Binary Size: {os.path.getsize(binary_path)} bytes\n\n"
          log_content += "Custom LED Animation Options Verified in Binary:\n"
          
          for mode in expected_modes:
              status = "AVAILABLE [CONFIRMED]" if mode in found_modes else "MISSING [FAILED]"
              log_content += f"  - {mode}: {status}\n"

          log_filename = "available_rgb_modes.txt"
          with open(log_filename, "w", encoding="utf-8") as log_file:
              log_file.write(log_content)

          print("\n" + log_content)
          EOF

      - name: Upload Artifacts (Binary & Verification Log)
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-mcu-custom-rgb
          path: |
            es-source/emulationstation
            available_rgb_modes.txt
          retention-days: 14
