name: Build EmulationStation for M9 Pro (ArkOS / ARM64 / RK3326)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU & Run on ARM64 Container (Ubuntu 20.04 / GLIBC 2.31)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: none
          distro: none
          base_image: '--platform=linux/aarch64 ubuntu:20.04'
          githubToken: ${{ github.token }}
          run: |
            set -euo pipefail
            WORKSPACE_ROOT="${PWD}"

            echo "[+] Step 1: Installing exhaustive ArkOS/RK3326 build dependencies..."
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake meson ninja-build git pkg-config premake4 \
              libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-image-dev \
              libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev libasound2-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libglvnd-dev \
              libdrm-dev libgbm-dev libinput-dev libevdev-dev libopenal-dev libpulse-dev \
              libboost-system-dev libboost-filesystem-dev libboost-date-time-dev \
              libboost-locale-dev libboost-thread-dev rapidjson-dev \
              libvlc-dev libvlccore-dev vlc-bin zip ca-certificates libwacom-dev python3

            echo "[+] Step 2: Building and installing official Christian Haitian linux-rga..."
            git clone https://github.com/christianhaitian/linux-rga.git /tmp/linux-rga
            cd /tmp/linux-rga
            git checkout 1fc02d56d97041c86f01bc1284b7971c6098c5fb
            mkdir -p build && cd build
            meson ..
            ninja
            
            # Deploy shared binaries and headers to standard system paths
            cp -r librga.so* /usr/lib/aarch64-linux-gnu/ 2>/dev/null || true
            cp -r librga.so* /usr/lib/ 2>/dev/null || true
            cd ..
            mkdir -p /usr/local/include/rga /usr/include/rga
            cp -f drmrga.h rga.h RgaApi.h RockchipRgaMacro.h /usr/local/include/rga/ 2>/dev/null || true
            cp -f drmrga.h rga.h RgaApi.h RockchipRgaMacro.h /usr/include/rga/ 2>/dev/null || true

            # Ensure linker symlinks exist for -lrga
            cd /usr/lib/aarch64-linux-gnu/ 2>/dev/null || cd /usr/lib/
            if ls librga.so.* 1> /dev/null 2>&1 && [ ! -e librga.so ]; then
              ln -s $(ls librga.so.* | head -n 1) librga.so
            fi

            echo "[+] Step 3: Building and installing libgo2 (Headers + Shared Libraries)..."
            git clone --depth=1 https://github.com/OtherCrashOverride/libgo2.git /tmp/libgo2
            cd /tmp/libgo2
            premake4 gmake
            make -j$(nproc)

            # Deploy go2 headers and shared libraries into system paths
            mkdir -p /usr/include/go2
            cp src/*.h /usr/include/go2/
            cp -P libgo2.so* /usr/lib/aarch64-linux-gnu/ 2>/dev/null || cp -P libgo2.so* /usr/lib/ 2>/dev/null || true
            
            # Ensure linker symlink exists for libgo2
            cd /usr/lib/aarch64-linux-gnu/ 2>/dev/null || cd /usr/lib/
            if ls libgo2.so.* 1> /dev/null 2>&1 && [ ! -e libgo2.so ]; then
              ln -s $(ls libgo2.so.* | head -n 1) libgo2.so
            fi

            echo "[+] Step 4: Cloning source and executing bulletproof patcher..."
            git clone --recursive --depth=1 https://github.com/christianhaitian/EmulationStation-fcamod.git /tmp/es-source
            cd /tmp/es-source

            python3 -c '
            import os, sys, re

            patched = False
            for root, dirs, files in os.walk("."):
                for file in files:
                    if file == "Renderer.h":
                        path = os.path.join(root, file)
                        with open(path, "r", encoding="utf-8") as f:
                            content = f.read()
                        
                        # Add SDL2 header if missing
                        if "<SDL2/SDL.h>" not in content:
                            content = "#include <SDL2/SDL.h>\n" + content

                        # Replace declaration with inline implementation using robust regex
                        pattern = r"SDL_Window\s*\*\s*getSDLWindow\s*\(\s*\)\s*;"
                        replacement = "inline SDL_Window* getSDLWindow() { return SDL_GL_GetCurrentWindow(); }"
                        
                        new_content, count = re.subn(pattern, replacement, content)
                        
                        if count > 0:
                            with open(path, "w", encoding="utf-8") as f:
                                f.write(new_content)
                            print(f"[✓] Regex replacement successful in {path}")
                            patched = True
                        elif "SDL_GL_GetCurrentWindow" in content:
                            print(f"[=] Already patched in {path}")
                            patched = True
                        else:
                            # Fallback: force injection inside namespace Renderer
                            injection = "\nnamespace Renderer {\n    inline SDL_Window* getSDLWindow() { return SDL_GL_GetCurrentWindow(); }\n}\n"
                            if "#endif" in content:
                                idx = content.rfind("#endif")
                                new_content = content[:idx] + injection + content[idx:]
                            else:
                                new_content = content + injection
                            
                            with open(path, "w", encoding="utf-8") as f:
                                f.write(new_content)
                            print(f"[✓] Fallback injection successful in {path}")
                            patched = True

            if not patched:
                print("[!] FATAL ERROR: Renderer.h was not found or could not be patched!")
                sys.exit(1)
            '

            # Mandatory Verification Gate (Fail immediately if symbol isn't present)
            echo "[+] Verifying patch in source tree..."
            if ! grep -rn "SDL_GL_GetCurrentWindow" /tmp/es-source/; then
                echo "[!] FATAL VERIFICATION ERROR: Symbol injection missing from source tree!" >&2
                exit 1
            fi
            echo "[✓] Source patch verified 100%!"

            echo "[+] Step 5: Configuring and compiling EmulationStation..."
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j2

            echo "[+] Step 6: Assembling release package..."
            PACKAGE_DIR="$WORKSPACE_ROOT/build_output/package"
            mkdir -p "$PACKAGE_DIR"

            # Copy executable binary
            find /tmp/es-source -type f -name "emulationstation" -perm /111 -exec cp {} "$PACKAGE_DIR/" \;
            
            # Copy UI resources directory
            if [ -d "/tmp/es-source/resources" ]; then
              cp -r "/tmp/es-source/resources" "$PACKAGE_DIR/"
            fi

            # Bundle compiled shared libraries
            cp -P /usr/lib/aarch64-linux-gnu/libgo2.so* "$PACKAGE_DIR/" 2>/dev/null || cp -P /usr/lib/libgo2.so* "$PACKAGE_DIR/" 2>/dev/null || true
            cp -P /usr/lib/aarch64-linux-gnu/librga.so* "$PACKAGE_DIR/" 2>/dev/null || cp -P /usr/lib/librga.so* "$PACKAGE_DIR/" 2>/dev/null || true

            # Collect scripts (.sh)
            cd "$WORKSPACE_ROOT"
            find . -maxdepth 1 -name "*.sh" -exec cp {} "$PACKAGE_DIR/" \; 2>/dev/null || true
            if [ -d ".github/scripts" ]; then
              find .github/scripts -maxdepth 1 -name "*.sh" -exec cp {} "$PACKAGE_DIR/" \; 2>/dev/null || true
            fi
            
            chmod +x "$PACKAGE_DIR"/*.sh 2>/dev/null || true

            echo "[+] Step 7: Archiving build artifacts..."
            cd "$PACKAGE_DIR"
            zip -r "$WORKSPACE_ROOT/build_output/emulationstation-fcamod-m9pro.zip" .
            echo "[✓] Build completed successfully!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: build_output/emulationstation-fcamod-m9pro.zip
          retention-days: 7
