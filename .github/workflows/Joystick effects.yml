name: kacke ES with Full OTA & RGB LED UI Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-es:
    runs-on: ubuntu-24.04-arm
    
    # Baut im Ubuntu 20.04 ARM64 Container für GLIBC 2.31 Kompatibilität (ArkOS)
    container:
      image: ubuntu:20.04

    steps:
      - name: Install System Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            build-essential cmake pkg-config git \
            libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev \
            libcurl4-openssl-dev libasound2-dev libgl1-mesa-dev \
            libeigen3-dev libboost-all-dev rapidjson-dev \
            libvlc-dev libvlccore-dev vlc-bin python3 fonts-droid-fallback binutils \
            ca-certificates

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone EmulationStation-fcamod Source (Recursive)
        run: |
          git clone --depth 1 --recursive https://github.com/lcdyk0517/EmulationStation-fcamod.git es-source

      - name: Deep Scan Codebase & Auto-Integrate Custom LED Modes + OTA Menu
        run: python3 .github/scripts/patch_es_source.py

      - name: Build EmulationStation Binary (compat toolchain)
        working-directory: es-source
        env:
          CFLAGS: "-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing"
          CXXFLAGS: "-mcpu=cortex-a35 -mtune=cortex-a35 -O3 -pipe -fno-strict-aliasing -static-libgcc -static-libstdc++"
          LDFLAGS: "-static-libgcc -static-libstdc++"
        run: |
          set -e
          if [ -f premake5.lua ]; then
            echo "[*] premake5.lua gefunden - baue mit Premake5"
            if ! command -v premake5 >/dev/null 2>&1; then
              git clone --depth 1 https://github.com/premake/premake-core.git /tmp/premake-core
              make -C /tmp/premake-core -f Bootstrap.mak linux
              cp /tmp/premake-core/bin/release/premake5 /usr/local/bin/premake5
            fi
            premake5 gmake2
            make -j"$(nproc)" config=release CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS"
          elif [ -f CMakeLists.txt ]; then
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            make -j"$(nproc)"
          else
            echo "[!] Kein unterstütztes Build-System gefunden."
            exit 1
          fi

      - name: Verify Custom Strings in Compiled Binary
        run: python3 .github/scripts/verify_es_binary.py

      - name: Upload Built Binary
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation-fcamod-m9pro
          path: |
            es-source/**/emulationstation*
          retention-days: 14
          if-no-files-found: error
